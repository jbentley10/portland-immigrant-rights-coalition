name: Create Weekly Update

on:
  push:
    branches: [main]
    paths:
      - "scripts/weekly-update-input.json"

jobs:
  create-update:
    name: Publish weekly update to Contentful
    runs-on: ubuntu-latest
    concurrency:
      group: create-weekly-update
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run create-weekly-update script
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ENVIRONMENT: ${{ secrets.CONTENTFUL_ENVIRONMENT }}
          CONTENTFUL_MANAGEMENT_TOKEN: ${{ secrets.CONTENTFUL_MANAGEMENT_TOKEN }}
        run: |
          # Pass 'y' automatically since there's no interactive terminal in CI
          echo "y" | npm run create-weekly-update
